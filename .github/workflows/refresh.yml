name: Refresh tournament data

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources
        shell: pwsh
        run: ./scripts/refresh.ps1

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json data/tournaments.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh tournament data"
            git push
          fi
